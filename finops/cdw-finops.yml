tags:
  - eProcurement
  - IT Distribution
  - Catalog
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for CDW. CDW does not bill for API calls; the cost surface is the
  product purchases that flow through the Catalog / PunchOut / eProcurement integration. FinOps reporting
  rolls up product spend by buyer system, cost center, and category, and uses API telemetry only as
  a control-plane signal.'
notes: API itself is not billed; meters track product purchases and integration usage that drive the
  product invoice.
sources:
  - https://www.cdw.com/content/cdw/en/services/eprocurement-and-custom-catalogs.html
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: CDW LLC
serviceCategory: IT Distribution + eProcurement
billingModel:
  pricingCategory: Pass-Through Product Purchase (No API Fee)
  billingFrequency: Per-Order / Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
    - Refund
focusColumns:
  ServiceName: CDW Catalog / eProcurement
  ServiceCategory: IT Distribution
  ProviderName: CDW
  PublisherName: CDW LLC
  InvoiceIssuerName: CDW LLC
  BillingCurrency: USD
meters:
  - name: catalog_api_requests
    unit: request
    aggregation: sum
    dimensions:
      - account
      - operation
  - name: punchout_sessions
    unit: session
    aggregation: count
    dimensions:
      - buyer_system
      - account
  - name: purchase_orders_received
    unit: po
    aggregation: count
    dimensions:
      - buyer_system
      - account
  - name: invoiced_amount
    unit: USD
    aggregation: sum
    dimensions:
      - account
      - product_category
      - cost_center
  - name: invoices_issued
    unit: invoice
    aggregation: count
    dimensions:
      - account
principles:
  - name: Visibility
    description: Combine CDW invoice exports (cXML / EDI) with PunchOut session telemetry to see who
      bought what, when, and through which buyer system.
  - name: Allocation
    description: Map cost centers to PunchOut sessions; carry that mapping into GL postings so CDW spend
      is allocated at order time, not at month-end.
  - name: Optimization
    description: Use CDW custom catalogs to enforce approved configurations and avoid maverick spend;
      consolidate vendors and renegotiate margins as volume grows; align order cadence to capture quarterly
      programs.
  - name: Accountability
    description: Procurement owns CDW relationship spend; IT manages the integration health; finance
      reconciles cXML invoices against PO data nightly.
maintainers:
