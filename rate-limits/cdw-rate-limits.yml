provider: CDW
providerId: cdw
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - eProcurement
  - Catalog
  - PunchOut
  - Rate Limiting
description: CDW's Catalog API and eProcurement integration surfaces are gated behind a B2B customer
  account; rate-limit documentation is not published on the public eprocurement-and-custom-catalogs
  page. Limits are negotiated with the CDW eProcurement / integration team during onboarding and align
  with the customer's expected order volume.
notes: Public eProcurement page does not publish numeric limits. Onboarding-time configuration only.
sources:
  - https://www.cdw.com/content/cdw/en/services/eprocurement-and-custom-catalogs.html
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Catalog API rate / quota
    scope: customer-account
    metric: varies
    limit: see CDW integration onboarding
  - name: PunchOut session rate
    scope: buyer-system
    metric: varies
    limit: see CDW integration onboarding
  - name: cXML / EDI purchase-order throughput
    scope: customer-account
    metric: varies
    limit: see CDW integration onboarding
policies:
  - name: Customer-scoped limits
    description: Limits apply per CDW customer account; high-order-volume customers have limits raised
      during onboarding.
  - name: Backoff
    description: On 429 / 503, retry with exponential backoff and jitter.
  - name: PunchOut session lifecycle
    description: PunchOut sessions are short-lived and tied to a buyer system's outbound URL; sessions
      expire after a documented inactivity window.
maintainers:
