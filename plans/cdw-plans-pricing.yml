description: CDW provides eProcurement integration to its B2B / public-sector / education / healthcare
  customers via the CDW Catalog API (real-time pricing + inventory) and the CDW eProcurement integration
  surface (PunchOut / cXML / OCI / EDI / electronic invoicing). Both surfaces are integration-only —
  no per-call API pricing is published; access is provisioned under a customer's CDW B2B account, and
  the only invoiced item is the underlying product purchase.
notes: API access is provisioned with the CDW customer account; there is no per-API-call price. Customer
  pays for products purchased through the integration, not for the API itself.
sources:
  - https://www.cdw.com/content/cdw/en/services/eprocurement-and-custom-catalogs.html
  - https://www.cdw.com/integrations/custompage/v2/6FB6697BBE2441968349584A24C5C459
plans:
  - id: cdw-customer-integration
    name: CDW Customer Integration (No Direct API Fee)
    type: enterprise
    description: Integration surface available to CDW customers under their B2B account agreement. CDW
      monetizes through the underlying product margin, not API access.
    entries:
      - label: Catalog API access
        name: catalog_api_access
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: included with CDW B2B account
        userMultiplied: false
      - label: eProcurement integration access
        name: eprocurement_access
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: included with CDW B2B account
        userMultiplied: false
      - label: Product purchase (passthrough)
        name: product_purchase
        type: metered
        metric: purchase
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: per CDW catalog price
        userMultiplied: false
    elements:
      - name: Real-time pricing + inventory
      - name: PunchOut (cXML / OCI)
      - name: cXML / EDI / flat-file purchase orders
      - name: Electronic invoicing (XML / EDI)
      - name: HTTP / SFTP / API / EDI transport
      - name: SAP Ariba / Coupa / Oracle / Jaggaer compatibility
